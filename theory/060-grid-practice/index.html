<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        body {
            height: 100vh;
            display: grid;
            grid-template-columns: 1fr 5fr;
            grid-template-rows: 1fr 7fr 1fr;
            gap: 10px;
            background-color: #D8D9De;

        }

        .header {
            grid-column: span 2;
            background-color: #393B45;

        }

        .aside {
            background-color: #6E7889;
        }

        .main {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            /* justify-content: space   -between; */

        }

        .footer {
            background-color: #584848;
            grid-column: span 2;
        }

        .section {
            background-color: #F3B54A;
            display: flex;
            border: 10px solid #F3B54A;
            border-radius: 10%;
        }

        @media (max-width:400px) {
            .main {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="header">Header</div>
    <div class="aside">Side Panel</div>
    <div class="main">
        <div class="section">Content Section 1</div>
        <div class="section">Content Section 2</div>
        <div class="section">Content Section 3</div>
    </div>
    <div class="footer">Footer</div>
</body>

</html>
