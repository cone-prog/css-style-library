<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Коты</title>
    <style>
        h1 {
            text-align: center;
            font-size: 40px;
            color: antiquewhite
        }

        body {
            background-color: rgb(70, 44, 44);
            padding: 20px;
        }

        .card-container {
            display: grid;
            background-color: brown;
            grid-template-columns: 1fr 1fr;
            margin: 10px;
        }

        .item {
            background-color: antiquewhite;
            padding: 20px 40px 20px 40px;
            margin: 20px;
            text-align: center;
        }

        @media (width<=800px) {
            .card-container {
                display: grid;
                background-color: brown;
                grid-template-columns: repeat(1, 1fr);
            }
        }
    </style>
</head>
